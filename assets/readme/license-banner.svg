<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-labelledby="t d"><title id="t">Licensing at a glance</title><desc id="d">Banner with a document icon and the licensing summary.</desc><defs><pattern id="lb-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2B2E34" opacity=".55"/></pattern><radialGradient id="lb-g1" cx="82%" cy="0%" r="70%"><stop offset="0" stop-color="#5018F7" stop-opacity=".42"/><stop offset="1" stop-color="#5018F7" stop-opacity="0"/></radialGradient><radialGradient id="lb-g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#2B029C" stop-opacity=".5"/><stop offset="1" stop-color="#2B029C" stop-opacity="0"/></radialGradient><linearGradient id="lb-lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C090F6"/><stop offset="1" stop-color="#5018F7"/></linearGradient></defs><rect x="0" y="0" width="1280" height="260" rx="18" fill="#111214" stroke="#2B2E34" stroke-width="1" /><rect width="1280" height="260" rx="18" fill="url(#lb-dots)"/><rect width="1280" height="260" rx="18" fill="url(#lb-g1)"/><rect width="1280" height="260" rx="18" fill="url(#lb-g2)"/><text x="72" y="66" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#C090F6" text-anchor="start" letter-spacing="2.2">LICENSING  ·  THIRD-PARTY NOTICES</text><text x="72" y="120" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#E8E9EB" text-anchor="start" >Licensing at a glance</text><text x="72" y="154" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9A9EA7" text-anchor="start" >Proprietary and all rights reserved, built on open source that keeps its own licence.</text><rect x="72" y="184" width="171" height="30" rx="15" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="157.5" y="203.55" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9A9EA7" text-anchor="middle" >All rights reserved</text><rect x="253" y="184" width="148" height="30" rx="15" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="327.0" y="203.55" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9A9EA7" text-anchor="middle" >Code - OSS (MIT)</text><rect x="411" y="184" width="171" height="30" rx="15" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="496.5" y="203.55" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9A9EA7" text-anchor="middle" >Open VSX extensions</text><rect x="592" y="184" width="208" height="30" rx="15" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="696.0" y="203.55" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9A9EA7" text-anchor="middle" >No Microsoft Marketplace</text><circle cx="1096" cy="128" r="120" fill="#5018F7" opacity=".16"/><circle cx="1096" cy="128" r="84" fill="#5018F7" opacity=".14"/><g transform="translate(1096 128) scale(1.35)"><path d="M-44 -66 H20 L48 -38 V66 H-44 Z" fill="url(#lb-lg)"/><path d="M20 -66 V-38 H48 Z" fill="#111214" opacity=".35"/><path d="M-26 -14 H26 M-26 8 H26 M-26 30 H6" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".92"/></g></svg>
