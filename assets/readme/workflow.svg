<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d"><title id="t">Task to pull request workflow</title><desc id="d">Six steps: create, delegate, watch, review, commit, ship.</desc><defs><pattern id="w-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2B2E34" opacity=".55"/></pattern><radialGradient id="w-g1" cx="82%" cy="0%" r="70%"><stop offset="0" stop-color="#5018F7" stop-opacity=".42"/><stop offset="1" stop-color="#5018F7" stop-opacity="0"/></radialGradient><radialGradient id="w-g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#2B029C" stop-opacity=".5"/><stop offset="1" stop-color="#2B029C" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1280" height="300" rx="18" fill="#111214" stroke="#2B2E34" stroke-width="1" /><rect width="1280" height="300" rx="18" fill="url(#w-dots)"/><rect width="1280" height="300" rx="18" fill="url(#w-g1)"/><rect width="1280" height="300" rx="18" fill="url(#w-g2)"/><text x="640.0" y="44" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="650" fill="#E8E9EB" text-anchor="middle" >From task to pull request</text><rect x="52" y="78" width="184" height="186" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="82" cy="112" r="15" fill="#5018F7"/><text x="82" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text><text x="108" y="118" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Create</text><text x="70" y="158" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >A workspace: a new Git</text><text x="70" y="180" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >worktree and branch from</text><text x="70" y="202" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >any base, SHA recorded.</text><path d="M238 171h16m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="258" y="78" width="184" height="186" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="288" cy="112" r="15" fill="#5018F7"/><text x="288" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text><text x="314" y="118" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Delegate</text><text x="276" y="158" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Hand it to a composer</text><text x="276" y="180" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >agent or launch your</text><text x="276" y="202" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >installed agent CLI.</text><path d="M444 171h16m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="464" y="78" width="184" height="186" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="494" cy="112" r="15" fill="#5018F7"/><text x="494" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text><text x="520" y="118" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Watch</text><text x="482" y="158" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Live status on the</text><text x="482" y="180" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >dashboard. Approve or</text><text x="482" y="202" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >deny each risky action.</text><path d="M650 171h16m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="670" y="78" width="184" height="186" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="700" cy="112" r="15" fill="#5018F7"/><text x="700" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4</text><text x="726" y="118" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Review</text><text x="688" y="158" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Per-file, per-hunk diff.</text><text x="688" y="180" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Accept, reject, or open</text><text x="688" y="202" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >the IDE at the line.</text><path d="M856 171h16m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="876" y="78" width="184" height="186" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="906" cy="112" r="15" fill="#5018F7"/><text x="906" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >5</text><text x="932" y="118" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Commit</text><text x="894" y="158" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Commit the exact tree</text><text x="894" y="180" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >you reviewed, with your</text><text x="894" y="202" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >own Git identity.</text><path d="M1062 171h16m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1082" y="78" width="184" height="186" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="1112" cy="112" r="15" fill="#5018F7"/><text x="1112" y="117.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >6</text><text x="1138" y="118" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Ship</text><text x="1100" y="158" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Push the branch and</text><text x="1100" y="180" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >open a GitHub pull</text><text x="1100" y="202" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >request.</text></svg>
