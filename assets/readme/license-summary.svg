<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d"><title id="t">Licensing in plain English</title><desc id="d">Three cards: what GitHub allows, what is not licensed, and third-party software.</desc><defs><pattern id="ls-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2B2E34" opacity=".55"/></pattern><radialGradient id="ls-g1" cx="82%" cy="0%" r="70%"><stop offset="0" stop-color="#5018F7" stop-opacity=".42"/><stop offset="1" stop-color="#5018F7" stop-opacity="0"/></radialGradient><radialGradient id="ls-g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#2B029C" stop-opacity=".5"/><stop offset="1" stop-color="#2B029C" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1280" height="380" rx="18" fill="#111214" stroke="#2B2E34" stroke-width="1" /><rect width="1280" height="380" rx="18" fill="url(#ls-dots)"/><rect width="1280" height="380" rx="18" fill="url(#ls-g1)"/><rect width="1280" height="380" rx="18" fill="url(#ls-g2)"/><text x="640.0" y="44" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="650" fill="#E8E9EB" text-anchor="middle" >In plain English</text><text x="640.0" y="68" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="middle" >A summary for orientation. The binding text is in LICENSE and NOTICE, and is not legal advice.</text><rect x="44" y="96" width="384" height="248" rx="14" fill="#181A1D" stroke="#3FB97A" stroke-width="1.6" /><text x="68" y="128" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#3FB97A" text-anchor="start" letter-spacing="1.8">WHAT GITHUB ALLOWS</text><text x="68" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="650" fill="#E8E9EB" text-anchor="start" >View and fork</text><text x="68" y="196" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >You can read this repository.</text><text x="68" y="221" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >You can fork it within GitHub,</text><text x="68" y="246" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >as GitHub’s terms provide.</text><text x="68" y="271" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >That permission comes from</text><text x="68" y="296" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >those terms, not from Axis.</text><rect x="452" y="96" width="384" height="248" rx="14" fill="#181A1D" stroke="#E5584F" stroke-width="1.6" /><text x="476" y="128" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E5584F" text-anchor="start" letter-spacing="1.8">NOT LICENSED</text><text x="476" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="650" fill="#E8E9EB" text-anchor="start" >Everything else</text><text x="476" y="196" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >Copying, modifying, merging,</text><text x="476" y="221" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >publishing, distributing,</text><text x="476" y="246" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >sublicensing or selling Axis.</text><text x="476" y="271" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >The Axis name, logos and</text><text x="476" y="296" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >icons are not licensed either.</text><rect x="860" y="96" width="384" height="248" rx="14" fill="#181A1D" stroke="#6EA8FE" stroke-width="1.6" /><text x="884" y="128" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6EA8FE" text-anchor="start" letter-spacing="1.8">THIRD PARTY</text><text x="884" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="650" fill="#E8E9EB" text-anchor="start" >Keeps its own licence</text><text x="884" y="196" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >Code - OSS is MIT licensed.</text><text x="884" y="221" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >npm packages and Open VSX</text><text x="884" y="246" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >extensions carry their own.</text><text x="884" y="271" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >Microsoft’s marks stay</text><text x="884" y="296" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="start" >Microsoft’s. Axis is unaffiliated.</text></svg>
