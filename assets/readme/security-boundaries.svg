<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d"><title id="t">Trust boundaries</title><desc id="d">Renderer, main process, daemon and the outside world, with the authority each one holds.</desc><defs><pattern id="sx-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2B2E34" opacity=".55"/></pattern><radialGradient id="sx-g1" cx="82%" cy="0%" r="70%"><stop offset="0" stop-color="#5018F7" stop-opacity=".42"/><stop offset="1" stop-color="#5018F7" stop-opacity="0"/></radialGradient><radialGradient id="sx-g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#2B029C" stop-opacity=".5"/><stop offset="1" stop-color="#2B029C" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1280" height="520" rx="18" fill="#111214" stroke="#2B2E34" stroke-width="1" /><rect width="1280" height="520" rx="18" fill="url(#sx-dots)"/><rect width="1280" height="520" rx="18" fill="url(#sx-g1)"/><rect width="1280" height="520" rx="18" fill="url(#sx-g2)"/><text x="640.0" y="44" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="650" fill="#E8E9EB" text-anchor="middle" >Trust boundaries</text><text x="640.0" y="68" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="middle" >Each hop to the right has more authority, and every hop validates what it receives.</text><rect x="44" y="100" width="268" height="262" rx="14" fill="#181A1D" stroke="#E5584F" stroke-width="1.6" /><text x="64" y="130" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E5584F" text-anchor="start" letter-spacing="1.8">UNTRUSTED</text><text x="64" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Electron renderer</text><circle cx="68" cy="192" r="3" fill="#E5584F"/><text x="80" y="196" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Agent view and IDE view UI</text><circle cx="68" cy="218" r="3" fill="#E5584F"/><text x="80" y="222" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Extensions and MCP servers</text><circle cx="68" cy="244" r="3" fill="#E5584F"/><text x="80" y="248" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Text an agent produced</text><rect x="64" y="288" width="228" height="1" fill="#2B2E34"/><text x="64" y="312" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#70757F" text-anchor="start" >Cannot touch the OS directly.</text><text x="64" y="330" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#70757F" text-anchor="start" >Everything it sends is</text><text x="64" y="348" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#70757F" text-anchor="start" >validated.</text><rect x="352" y="100" width="268" height="262" rx="14" fill="#181A1D" stroke="#E5A93C" stroke-width="1.6" /><text x="372" y="130" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E5A93C" text-anchor="start" letter-spacing="1.8">MAIN PROCESS</text><text x="372" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Electron main</text><circle cx="376" cy="192" r="3" fill="#E5A93C"/><text x="388" y="196" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Native confirmation dialogs</text><circle cx="376" cy="218" r="3" fill="#E5A93C"/><text x="388" y="222" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Trust attestation for repos</text><circle cx="376" cy="244" r="3" fill="#E5A93C"/><text x="388" y="248" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Window and process ownership</text><rect x="372" y="288" width="228" height="1" fill="#2B2E34"/><text x="372" y="312" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#70757F" text-anchor="start" >Shows the dialog the renderer</text><text x="372" y="330" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#70757F" text-anchor="start" >cannot fake.</text><rect x="660" y="100" width="268" height="262" rx="14" fill="#181A1D" stroke="#C090F6" stroke-width="1.6" /><text x="680" y="130" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#C090F6" text-anchor="start" letter-spacing="1.8">PRIVILEGED</text><text x="680" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Local daemon</text><circle cx="684" cy="192" r="3" fill="#C090F6"/><text x="696" y="196" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Terminals, Git, execution</text><circle cx="684" cy="218" r="3" fill="#C090F6"/><text x="696" y="222" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Approval challenges</text><circle cx="684" cy="244" r="3" fill="#C090F6"/><text x="696" y="248" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Audit log and journal</text><rect x="680" y="288" width="228" height="1" fill="#2B2E34"/><text x="680" y="312" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#70757F" text-anchor="start" >Privileged only within what you</text><text x="680" y="330" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#70757F" text-anchor="start" >have granted.</text><rect x="968" y="100" width="268" height="262" rx="14" fill="#181A1D" stroke="#3FB97A" stroke-width="1.6" /><text x="988" y="130" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#3FB97A" text-anchor="start" letter-spacing="1.8">THE WORLD</text><text x="988" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Machine and network</text><circle cx="992" cy="192" r="3" fill="#3FB97A"/><text x="1004" y="196" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Your files and worktrees</text><circle cx="992" cy="218" r="3" fill="#3FB97A"/><text x="1004" y="222" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Provider APIs</text><circle cx="992" cy="244" r="3" fill="#3FB97A"/><text x="1004" y="248" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >GitHub, Open VSX</text><rect x="988" y="288" width="228" height="1" fill="#2B2E34"/><text x="988" y="312" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#70757F" text-anchor="start" >Reached only through the</text><text x="988" y="330" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#70757F" text-anchor="start" >daemon.</text><path d="M319 230h22m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="332" y="382" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#70757F" text-anchor="middle" >validated IPC</text><path d="M627 230h22m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="382" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#70757F" text-anchor="middle" >approval proof</text><path d="M935 230h22m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="948" y="382" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#70757F" text-anchor="middle" >daemon calls only</text><rect x="44" y="404" width="1192" height="76" rx="12" fill="#14161A" stroke="#2B2E34" stroke-width="1" /><text x="68" y="433" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#E5A93C" text-anchor="start" letter-spacing="1.8">AGENT CLIs</text><text x="68" y="458" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9EA7" text-anchor="start" >Run with your privileges and credentials under their own permission models. Axis gives them a clean environment, flags drift in Git configuration and hooks, and never calls a worktree a sandbox.</text></svg>
