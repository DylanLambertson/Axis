<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-labelledby="t d"><title id="t">Security, privacy and trust model</title><desc id="d">Banner with a shield and the main security properties.</desc><defs><pattern id="sb-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2B2E34" opacity=".55"/></pattern><radialGradient id="sb-g1" cx="82%" cy="0%" r="70%"><stop offset="0" stop-color="#5018F7" stop-opacity=".42"/><stop offset="1" stop-color="#5018F7" stop-opacity="0"/></radialGradient><radialGradient id="sb-g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#2B029C" stop-opacity=".5"/><stop offset="1" stop-color="#2B029C" stop-opacity="0"/></radialGradient><linearGradient id="sb-sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C090F6"/><stop offset="1" stop-color="#5018F7"/></linearGradient></defs><rect x="0" y="0" width="1280" height="260" rx="18" fill="#111214" stroke="#2B2E34" stroke-width="1" /><rect width="1280" height="260" rx="18" fill="url(#sb-dots)"/><rect width="1280" height="260" rx="18" fill="url(#sb-g1)"/><rect width="1280" height="260" rx="18" fill="url(#sb-g2)"/><text x="72" y="66" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#C090F6" text-anchor="start" letter-spacing="2.2">SECURITY  ·  PRIVACY  ·  TRUST</text><text x="72" y="120" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#E8E9EB" text-anchor="start" >Security, privacy and trust model</text><text x="72" y="154" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9A9EA7" text-anchor="start" >Isolation stated plainly. Approvals that cannot be replayed. A record that shows tampering.</text><rect x="72" y="184" width="163" height="30" rx="15" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="153.5" y="203.55" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9A9EA7" text-anchor="middle" >Untrusted renderer</text><rect x="245" y="184" width="156" height="30" rx="15" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="323.0" y="203.55" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9A9EA7" text-anchor="middle" >Privileged daemon</text><rect x="411" y="184" width="178" height="30" rx="15" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="500.0" y="203.55" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9A9EA7" text-anchor="middle" >Single-use approvals</text><rect x="599" y="184" width="163" height="30" rx="15" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="680.5" y="203.55" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9A9EA7" text-anchor="middle" >Hash-chained audit</text><circle cx="1096" cy="128" r="120" fill="#5018F7" opacity=".16"/><circle cx="1096" cy="128" r="84" fill="#5018F7" opacity=".14"/><g transform="translate(1096 128) scale(1.45)"><path d="M0 -62 L54 -42 V8 C54 42 28 64 0 76 C-28 64 -54 42 -54 8 V-42 Z" fill="url(#sb-sg)"/><path d="M0 -50 L43 -34 V8 C43 34 22 52 0 62 C-22 52 -43 34 -43 8 V-34 Z" fill="#111214" opacity=".35"/><path d="M-20 4 L-5 19 L24 -14" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
