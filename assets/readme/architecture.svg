<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="t d"><title id="t">Axis architecture</title><desc id="d">Shells, the Axis shell with two views, the local daemon packages, and external systems.</desc><defs><pattern id="a-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2B2E34" opacity=".55"/></pattern><radialGradient id="a-g1" cx="82%" cy="0%" r="70%"><stop offset="0" stop-color="#5018F7" stop-opacity=".42"/><stop offset="1" stop-color="#5018F7" stop-opacity="0"/></radialGradient><radialGradient id="a-g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#2B029C" stop-opacity=".5"/><stop offset="1" stop-color="#2B029C" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1280" height="760" rx="18" fill="#111214" stroke="#2B2E34" stroke-width="1" /><rect width="1280" height="760" rx="18" fill="url(#a-dots)"/><rect width="1280" height="760" rx="18" fill="url(#a-g1)"/><rect width="1280" height="760" rx="18" fill="url(#a-g2)"/><text x="640.0" y="44" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="650" fill="#E8E9EB" text-anchor="middle" >Architecture at a glance</text><text x="640.0" y="68" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="middle" >A thin, owned shell on Code OSS, with every privileged action behind a local daemon.</text><rect x="40" y="92" width="1200" height="92" rx="14" fill="#14161A" stroke="#2B2E34" stroke-width="1" /><text x="60" y="116" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#70757F" text-anchor="start" letter-spacing="1.6">SHELLS</text><rect x="60" y="112" width="560" height="62" rx="10" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="74" y="136" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#E8E9EB" text-anchor="start" >Electron desktop app</text><text x="74" y="156" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >macOS first, with Windows and Linux in CI</text><rect x="640" y="112" width="580" height="62" rx="10" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="654" y="136" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#E8E9EB" text-anchor="start" >Browser client (later)</text><text x="654" y="156" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Remote workspace gateway, planned for Phase 2</text><path d="M340 176V204m-6-7l6 7 6-7" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M930 176V204m-6-7l6 7 6-7" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="204" width="1200" height="168" rx="14" fill="#14161A" stroke="#2B2E34" stroke-width="1" /><text x="60" y="228" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#70757F" text-anchor="start" letter-spacing="1.6">AXIS SHELL  ·  ONE CUSTOM WORKBENCH ON CODE OSS</text><rect x="60" y="234" width="560" height="118" rx="10" fill="#1D1740" stroke="#5018F7" stroke-width="1.2" /><text x="74" y="258" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#E8E9EB" text-anchor="start" >Agent view  (Axis-owned, default)</text><text x="74" y="278" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Dashboard  ·  workspace view  ·  file tree</text><text x="74" y="295" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Changes and diff review  ·  terminals and panes</text><text x="74" y="312" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Composer  ·  agent activity  ·  approvals</text><rect x="640" y="234" width="580" height="118" rx="10" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="654" y="258" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#E8E9EB" text-anchor="start" >IDE view  (Code OSS parts)</text><text x="654" y="278" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Editor  ·  explorer  ·  search  ·  Git  ·  debugger</text><text x="654" y="295" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Language services  ·  extension host</text><text x="654" y="312" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Opens at the exact file and line you clicked</text><path d="M640 376V410m-6-7l6 7 6-7" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="397.0" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#70757F" text-anchor="start" >validated IPC bridge</text><rect x="40" y="410" width="1200" height="196" rx="14" fill="#14161A" stroke="#2B2E34" stroke-width="1" /><text x="60" y="434" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#70757F" text-anchor="start" letter-spacing="1.6">LOCAL DAEMON  ·  HOLDS TERMINAL, GIT AND EXECUTION AUTHORITY</text><rect x="60" y="440" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="72" y="465" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/protocol</text><text x="72" y="486" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Versioned contracts</text><rect x="294" y="440" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="306" y="465" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/daemon</text><text x="306" y="486" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Dispatch, tiers, limits</text><rect x="528" y="440" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="540" y="465" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/challenge</text><text x="540" y="486" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Approvals for risky ops</text><rect x="762" y="440" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="774" y="465" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/worktrees</text><text x="774" y="486" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Worktree lifecycle</text><rect x="996" y="440" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="1008" y="465" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/git-ops</text><text x="1008" y="486" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Commit and push</text><rect x="60" y="514" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="72" y="539" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/pty-policy</text><text x="72" y="560" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Terminal environments</text><rect x="294" y="514" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="306" y="539" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/audit</text><text x="306" y="560" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Hash-chained log</text><rect x="528" y="514" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="540" y="539" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/journal</text><text x="540" y="560" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Runs and recovery</text><rect x="762" y="514" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="774" y="539" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/providers</text><text x="774" y="560" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Adapter API, guard</text><rect x="996" y="514" width="220" height="62" rx="9" fill="#202227" stroke="#2B2E34" stroke-width="1" /><text x="1008" y="539" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="650" fill="#C090F6" text-anchor="start" >@axis/vault</text><text x="1008" y="560" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#9A9EA7" text-anchor="start" >Connection secrets</text><path d="M340 610V640m-6-7l6 7 6-7" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M930 610V640m-6-7l6 7 6-7" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="640" width="1200" height="100" rx="14" fill="#14161A" stroke="#2B2E34" stroke-width="1" /><text x="60" y="664" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#70757F" text-anchor="start" letter-spacing="1.6">WHAT IT TOUCHES</text><rect x="60" y="668" width="270" height="52" rx="10" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="195.0" y="700" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E8E9EB" text-anchor="middle" >Git worktrees</text><rect x="345" y="668" width="250" height="52" rx="10" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="470.0" y="700" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E8E9EB" text-anchor="middle" >SQLite journal</text><rect x="610" y="668" width="280" height="52" rx="10" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="750.0" y="700" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E8E9EB" text-anchor="middle" >Model providers</text><rect x="905" y="668" width="315" height="52" rx="10" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><text x="1062.5" y="700" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E8E9EB" text-anchor="middle" >Your agent CLIs</text></svg>
