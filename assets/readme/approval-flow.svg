<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d"><title id="t">How an approval works</title><desc id="d">Five steps from request to a single-use, audited approval.</desc><defs><pattern id="af-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2B2E34" opacity=".55"/></pattern><radialGradient id="af-g1" cx="82%" cy="0%" r="70%"><stop offset="0" stop-color="#5018F7" stop-opacity=".42"/><stop offset="1" stop-color="#5018F7" stop-opacity="0"/></radialGradient><radialGradient id="af-g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#2B029C" stop-opacity=".5"/><stop offset="1" stop-color="#2B029C" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1280" height="340" rx="18" fill="#111214" stroke="#2B2E34" stroke-width="1" /><rect width="1280" height="340" rx="18" fill="url(#af-dots)"/><rect width="1280" height="340" rx="18" fill="url(#af-g1)"/><rect width="1280" height="340" rx="18" fill="url(#af-g2)"/><text x="640.0" y="44" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="650" fill="#E8E9EB" text-anchor="middle" >How an approval works</text><text x="640.0" y="68" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9EA7" text-anchor="middle" >For destructive, tier 3 to 5 actions. An agent cannot approve its own request.</text><rect x="45" y="100" width="220" height="150" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="75" cy="134" r="15" fill="#5018F7"/><text x="75" y="139.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text><text x="101" y="140" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Request</text><text x="63" y="184" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >A risky action arrives</text><text x="63" y="205" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >without an approval.</text><path d="M268 175h22m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="295" y="100" width="220" height="150" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="325" cy="134" r="15" fill="#5018F7"/><text x="325" y="139.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text><text x="351" y="140" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Challenge</text><text x="313" y="184" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >The daemon binds the exact</text><text x="313" y="205" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >request, target and content.</text><path d="M518 175h22m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="545" y="100" width="220" height="150" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="575" cy="134" r="15" fill="#5018F7"/><text x="575" y="139.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text><text x="601" y="140" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >You confirm</text><text x="563" y="184" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >The renderer resolves it and</text><text x="563" y="205" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >a native dialog confirms.</text><path d="M768 175h22m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="795" y="100" width="220" height="150" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="825" cy="134" r="15" fill="#5018F7"/><text x="825" y="139.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4</text><text x="851" y="140" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Retry</text><text x="813" y="184" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >The request returns with the</text><text x="813" y="205" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >challenge id. Content is rechecked.</text><path d="M1018 175h22m-5-5l5 5-5 5" stroke="#C090F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1045" y="100" width="220" height="150" rx="12" fill="#181A1D" stroke="#2B2E34" stroke-width="1" /><circle cx="1075" cy="134" r="15" fill="#5018F7"/><text x="1075" y="139.5" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" >5</text><text x="1101" y="140" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="650" fill="#E8E9EB" text-anchor="start" >Spent once</text><text x="1063" y="184" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >Burned before any await, then</text><text x="1063" y="205" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A9EA7" text-anchor="start" >audited with your identity.</text><text x="640.0" y="290" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#70757F" text-anchor="middle" >No bearer tokens exist. An unknown id, a wrong window and a wrong actor all fail identically, so a probe learns nothing.</text><text x="640.0" y="312" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#70757F" text-anchor="middle" >A changed request, a changed target or changed content after you confirmed makes the approval useless.</text></svg>
