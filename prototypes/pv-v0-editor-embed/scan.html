<!-- PV-V0 key scan: registers every workbench contribution at the pin (the desktop workbench main by default, or the
     web one with ?main=web; never started), adds the keybindings that built-in extensions contribute in their
     package.json (extension-keys.json, written by prepare.mjs), then lists each keybinding that can fire while focus
     is in the side-panel editor in any of several states of the hidden IDE and probes whether its command reads the editor part's active editor directly.
     Read by scan-keys.mjs. -->
<html><head><meta charset="utf-8"></head><body><script type="module">
const errs = window.errs = [];
globalThis._VSCODE_FILE_ROOT = new URL('./', location.href).href; // where FileAccess resolves module ids
// The desktop main reads the Electron preload globals at import; a stub that answers every read lets it register its
// contributions (nothing is started, so nothing is sent).
const stub = () => new Proxy(function () { }, { get: (_t, p) => p === 'then' ? undefined : p === Symbol.toPrimitive ? () => '' : typeof p === 'symbol' ? undefined : stub(), apply: () => stub() });
globalThis.vscode = { ipcRenderer: stub(), ipcMessagePort: stub(), webFrame: stub(), webUtils: stub(), context: stub(),
	process: { platform: 'linux', arch: 'x64', env: {}, versions: {}, type: 'renderer', execPath: '', cwd: () => '/', shellEnv: async () => ({}), getProcessMemoryInfo: async () => ({}), on: () => undefined } };
const main = new URLSearchParams(location.search).get('main') === 'web' ? 'web' : 'desktop';
try { await import(main === 'web' ? './vs/workbench/workbench.web.main.internal.js' : './vs/workbench/workbench.desktop.main.js'); } catch (e) { errs.push(String(e?.stack ?? e)); }
const { ContextKeyExpr } = await import('./vs/platform/contextkey/common/contextkey.js');
const { KeybindingsRegistry } = await import('./vs/platform/keybinding/common/keybindingsRegistry.js');
const { CommandsRegistry } = await import('./vs/platform/commands/common/commands.js');
const { EditorExtensionsRegistry } = await import('./vs/editor/browser/editorExtensions.js');
const { MenuRegistry } = await import('./vs/platform/actions/common/actions.js');
const { KeyCodeUtils } = await import('./vs/base/common/keyCodes.js');

// Context while focus is in the side-panel editor and an IDE editor is open but hidden (Agent view).
const context = {
	editorTextFocus: true, editorFocus: true, textInputFocus: true, inputFocus: true, editorReadonly: false, editorLangId: 'typescript',
	axisSidePanelEditorFocus: true, axisView: 'agent',
	activeEditor: 'workbench.editors.files.textFileEditor', activeEditorGroupEmpty: false, editorIsOpen: true, multipleEditorGroups: false,
	activeEditorIsDirty: false, activeEditorCanRevert: true, activeEditorAvailableEditorIds: '', resourceScheme: 'file', resourceExtname: '.ts',
	resourceFilename: 'b.ts', isFileSystemResource: true, resourceSet: true, isWeb: main === 'web', isLinux: true, workbenchState: 'workspace', workspaceFolderCount: 1,
	debuggersAvailable: true, debugState: 'inactive', inDebugMode: false, taskCommandsRegistered: true,
	textCompareEditorVisible: false, textCompareEditorActive: false, sideBarVisible: false, panelVisible: false, auxiliaryBarVisible: true,
};
// The scan's context is one state of the hidden IDE; a keybinding whose \`when\` is false there may still hold in another
// (review r3 N2). Each candidate is kept when its \`when\` holds in any of these states, and lists the states it holds in.
// The side editor's own keys (focus, language, read-only) stay fixed; only workbench-global state and user modes vary.
const STATES = {
	base: {},
	screenReader: { accessibilityModeEnabled: true },
	diff: { textCompareEditorVisible: true, textCompareEditorActive: true, activeEditor: 'workbench.editors.textDiffEditor', isInDiffEditor: false },
	groups: { multipleEditorGroups: true, activeEditorGroupIndex: 2, activeEditorGroupLast: true, editorPartMultipleEditorGroups: true },
	sideBySide: { sideBySideEditorActive: true, activeEditorCanSplitInGroup: true, activeEditor: 'workbench.editor.sidebysideEditor' },
	dirty: { activeEditorIsDirty: true },
	debugging: { inDebugMode: true, debugState: 'stopped', debugType: 'node' },
	panels: { sideBarVisible: true, panelVisible: true, auxiliaryBarVisible: true },
};
const evaluators = Object.entries(STATES).map(([name, over]) => ({ name, evaluator: { getValue: key => (key in over ? over[key] : context[key]) } }));
const holdsIn = expr => evaluators.filter(e => !expr || expr.evaluate(e.evaluator)).map(e => e.name);
const editorActions = new Set([...EditorExtensionsRegistry.getEditorActions()].map(a => a.id));
const isEditorCommand = id => editorActions.has(id) || !!EditorExtensionsRegistry.getEditorCommand(id);

// Every service is a proxy that records what the handler reads; a handler looping on a proxy is stopped after a
// fixed number of reads.
function recorder(log) {
	let reads = 0;
	const make = path => new Proxy(function () { }, {
		get(_t, prop) {
			if (++reads > 500) { throw new Error('read limit'); }
			if (prop === 'then' || typeof prop === 'symbol') { return undefined; }
			log.add(`${path}.${String(prop)}`);
			return make(`${path}.${String(prop)}`);
		},
		apply() { return make(`${path}()`); },
	});
	return { get: id => { log.add(String(id)); return make(String(id)); } };
}

const ACTIVE = /^(editorService|editorGroupsService|codeEditorService|textFileService|editorGroupService)\.(active|getActiveCodeEditor|getFocusedCodeEditor|activeGroup|activeEditor|activeEditorPane|activeTextEditorControl|activeTextEditorLanguageId|visibleEditors|visibleTextEditorControls|mainPart|groups)/;
// The candidates: default keybindings that can fire in the side-panel editor and are not editor commands, then the
// built-in extensions' package.json keybindings that can fire there.
const core = KeybindingsRegistry.getDefaultKeybindings().filter(item => item.command && !item.command.startsWith('-') && item.keybinding
	&& holdsIn(item.when).length > 0 && !isEditorCommand(item.command));
const candidates = core.map(item => ({ source: 'core', command: item.command, weight: item.weight1, when: item.when?.serialize() ?? null, states: holdsIn(item.when).join(' '),
	keys: item.keybinding.chords.map(c => [c.ctrlKey && 'Ctrl', c.shiftKey && 'Shift', c.altKey && 'Alt', c.metaKey && 'Meta', KeyCodeUtils.toString(c.keyCode)].filter(Boolean).join('+')).join(' ') }));
const extensionKeys = await fetch('./extension-keys.json').then(r => r.ok ? r.json() : []).catch(() => []);
for (const k of extensionKeys) {
	let expr;
	try { expr = k.when ? ContextKeyExpr.deserialize(k.when) : undefined; } catch { continue; }
	if (!k.command || k.command.startsWith('-') || holdsIn(expr).length === 0 || isEditorCommand(k.command)) { continue; }
	candidates.push({ source: `extension:${k.extension}`, command: k.command, weight: 300, when: k.when ?? null, states: holdsIn(expr).join(' '), keys: k.key });
}
window.extensionKeyCount = extensionKeys.length;
window.total = KeybindingsRegistry.getDefaultKeybindings().length;
window.describe = i => {
	const item = candidates[i];
	const title = MenuRegistry.getCommand(item.command)?.title;
	return { ...item, title: typeof title === 'string' ? title : title?.value ?? '' };
};
window.count = candidates.length;
// Runs one handler against recording services (the driver gives up on a handler that never returns).
window.probe = async i => {
	const log = new Set();
	let threw = '';
	if (!CommandsRegistry.getCommand(candidates[i].command)) {
		// A core command registered later (at runtime) must be classified by hand. An extension's own command runs in
		// the extension host, whose activeTextEditor follows text focus.
		return { verdict: candidates[i].source === 'core' ? 'not-registered' : 'extension-host', reads: [], threw };
	}
	try {
		const r = CommandsRegistry.getCommand(candidates[i].command)?.handler?.(recorder(log));
		if (r && typeof r.catch === 'function') { r.catch(() => undefined); }
	} catch (e) { threw = String(e?.message ?? e).slice(0, 60); }
	await new Promise(r => setTimeout(r, 0));
	const reads = [...log].filter(s => ACTIVE.test(s));
	const delegates = [...log].some(s => /^(instantiationService|commandService)\.(invokeFunction|executeCommand|createInstance)/.test(s));
	return { verdict: reads.length ? 'reads-active-editor' : delegates ? 'delegates' : log.size ? 'other-services' : 'no-services', reads: reads.slice(0, 4), threw };
};
window.ready = true;
</script></body></html>
